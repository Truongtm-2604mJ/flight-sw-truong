# Lab 7.3 - Target build and test: nightly, and on demand.
# RTEMS 6.1 cross toolchain and SIS built once by the RTEMS Source Builder at a
# pinned commit and cached; RTEMS 6.1 LEON3 BSP built and cached with it. Then
# the integration image and the validation campaign run under SIS, each with a
# termination marker and a timeout (no human reads the console).
#
# The session plan says QEMU; this project's target has been SIS since
# Session 3 (same LEON3 BSP), and SIS is what the RSB builds with the
# toolchain.
name: nightly-target

on:
  schedule:
    - cron: "17 2 * * *"           # 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  RSB_COMMIT: b1aec32059aa0e86385ff75ec01daf93713fa382     # rtems-source-builder tag 6.1
  RTEMS_COMMIT: 0a46769ba42d3476b0f37a85db49b3276658d293   # rtems tag 6.1
  RTEMS_PREFIX: /opt/rtems/6

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 300           # a cold toolchain build takes 1 to 3 h
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
              build-essential flex bison texinfo unzip pax python3-dev python3-yaml \
              libncurses-dev zlib1g-dev cppcheck clang-18 llvm-18 libclang-rt-18-dev
          for t in clang llvm-cov llvm-profdata; do sudo ln -sf /usr/bin/$t-18 /usr/local/bin/$t; done
          python3 -m pip install --break-system-packages --user gcovr==7.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo mkdir -p "$RTEMS_PREFIX" && sudo chown "$USER" "$RTEMS_PREFIX"

      - name: Restore RTEMS toolchain and LEON3 BSP
        id: rtems
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: /opt/rtems/6
          key: rtems-${{ env.RSB_COMMIT }}-${{ env.RTEMS_COMMIT }}-sparc-leon3-v1

      - name: Build RTEMS toolchain and BSP (cache miss only)
        if: steps.rtems.outputs.cache-hit != 'true'
        run: tests/support/build_rtems.sh

      - name: Check tool versions
        run: tests/support/check_tools.sh

      - name: Integration image on SIS, then the validation campaign on SIS
        run: make -C tests target RTEMS_PREFIX="$RTEMS_PREFIX"

      - name: Archive target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: target-${{ github.sha }}
          retention-days: 30
          path: |
            tests/build/integration/*.log
            labs/session-07/validation/results-sis
