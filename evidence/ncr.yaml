# LOTUS-1 (capstone; started in Lab 7.4) - Nonconformance reports and test anomalies (structured; the
# narrative is ncr-log.md). Read by build_matrix.py to link failed
# requirements to their NCR.
#
# kind: NCR  the product does not meet a requirement
#       TA   test anomaly: the test, not the product, was wrong
#       OBS  validation observation: no requirement violated, but the
#            behaviour may not meet the mission need (a requirement gap)
# severity (NCR): critical (loss of vehicle or mission possible),
#                 major (requirement violated with operational impact and no
#                 workaround), minor (violated, workaround exists, no safety impact)
# status: open | fixed (closed after retest) | deferred (accepted until a stated point)

ncrs:
  - id: NCR-01
    kind: NCR
    requirement: TMTC-040
    severity: minor
    status: deferred
    found_by: VT-TMTC-040, campaign run 1 (host simulation), repeated in runs 2 and 3
    description: >-
      TC(8,1) "set mode" is acknowledged with TM(1,7), completion of execution,
      when the request is posted to the mode machine. The mode changes at the
      next supervisor cycle, up to 2.0 s later: measured 1.999 s in all three runs.
      An operator or procedure that moves on as soon as TM(1,7) arrives sees a
      vehicle still in the old mode; the first HK after TM(1,7) shows it.
    cause: >-
      Introduced in Session 6 by the cyclic evaluation (divergence D-07). The
      service interface (tc_handler exec returns once, and TM(1,7) follows at
      once) assumes every command takes effect inside exec. With the generated
      mode machine that is no longer true for TC(8,1). MM-150 bounds the delay
      but does not say which report marks completion.
    disposition: >-
      Deferred, with an operational workaround until the fix. Workaround:
      procedures wait for the TM(5,x) mode transition report (MM-080), within
      3.0 s (MM-150), not for TM(1,7). Planned fix (Session 8 or capstone):
      - an exec result "completion pending" in tc_handler: TM(1,1) is sent,
        TM(1,7) is not;
      - the services keep the request ID and ack flags of the pending TC(8,1);
      - the mode machine's transition hook marks it complete, and the
        supervisor sends TM(1,7) after it releases the mode lock (lock order:
        tc lock before mode lock, Session 5 Section 4);
      - a command discarded by the model (MM-140) gets TM(1,8) instead.
      This touches the Session 4 handler, the services and fdir6.c. It is not
      done in this session because it changes the service 1 contract that
      every TC uses, and needs its own unit, integration and validation tests.
    retest: VT-TMTC-040 must pass; IT-06 must then expect TM(1,7) after the transition report.

  - id: NCR-02
    kind: NCR
    requirement: TMTC-030
    severity: minor
    status: fixed
    found_by: VT-TMTC-030, campaign run 1 (host simulation)
    description: >-
      A received line longer than the TC_RX buffer (here 121 octets, 245
      characters) was dropped without being counted. The HK TC rejected
      counter rose by 3 for the 4 undecodable lines sent. The ground cannot see
      that kind of link noise.
    cause: >-
      tmtc5.c tc_rx_task(): at the end of a line it called process_line()
      only if the line had not overflowed, and the overflow branch counted
      nothing. process_line() counts every other undecodable line.
    disposition: >-
      Fixed in labs/session-05/app/tmtc5.c: an overflowed line is counted with
      tc_count_link_error() under the tc lock, like the other link errors.
    retest: VT-TMTC-030 PASS in campaign run 2 (counter +4).

  - id: TA-01
    kind: TA
    requirement: MM-030
    status: fixed
    found_by: VT-MM-030, campaign run 1
    description: >-
      VT-MM-030 failed in run 1, reporting HK SID 1 after the SAFE transition.
      The log shows only SID 2 in that boot. The test compared onboard times
      against the telemetry of every run of the campaign, and onboard time
      restarts at every boot, so SID 1 reports from run R1 (onboard times
      above 2.0 s) were counted.
    disposition: Test corrected to use the current boot only. The same fix was applied to the two schedule tests that had the same pattern (VT-MM-020a/b), where it had not yet caused a failure.
    retest: VT-MM-030 PASS in run 2. The product was not changed.

  - id: TA-02
    kind: TA
    requirement: TMTC-020, TMTC-010
    status: fixed
    found_by: integration suite, first run (labs/session-07/test-runs/integration-host-sim-first-run.log)
    description: >-
      IT-02 and IT-04 expected packet-level rejections to be addressed to the
      TC's source ID. By design, a TC that fails a packet-level check has an
      untrusted source ID, and its report goes to destination 0 (Session 4
      design note, Section 3). IT-08 expected TM(1,7) right after TM(1,1), but
      the inhibit event is emitted during execution, between them.
    disposition: Tests corrected to the documented behaviour. The product was not changed.
    retest: Integration suite 11/11, and 20 consecutive runs passing.

  - id: TA-03
    kind: TA
    requirement: (integration level, all IT cases)
    status: fixed
    found_by: first run of the integration image on SIS (make -C tests target)
    description: >-
      On RTEMS 6 / LEON3 under SIS, the integration image stopped at start with
      RTEMS fatal error 38 (INTERNAL_ERROR_ILLEGAL_USE_OF_FLOATING_POINT_UNIT)
      in its Init task. The same image passes on the host simulation.
    cause: >-
      Test harness configuration. The application runs the TC path in tasks
      with the RTEMS_FLOATING_POINT attribute (Init in lab5.c, TC_RX and TM_TX
      in tmtc5.c); the integration program gave its Init task and its two
      dispatching tasks the default attributes. The host simulation of the
      RTEMS API ignores task attributes, so only the target could show this:
      an example of the defect class the host level cannot catch (verification
      report, Section 1).
    disposition: >-
      int_tc_path.c now configures its tasks like the application. The flight
      code was not changed. The SIS runner also needed a pseudo-terminal, like
      the ground scripts (run_image.py --pty).
    retest: Integration image on SIS (make -C tests target).

  - id: OBS-01
    kind: OBS
    requirement: (none; candidate FDIR-120)
    status: open
    found_by: VT-OBS-01 (exploratory), campaign runs 1, 2 and 3
    description: >-
      With T_BAT still in alarm, a ground TC(8,1) NOMINAL sent in a later
      cycle than the alarm takes the vehicle to NOMINAL, and it stays there. HK
      shows the T_BAT monitor in ALARM, but no event reminds the operators, and
      the FDIR does not act again, because the monitor reports transitions only
      and its alarm was raised before the command. MM-130 covers only the
      same-cycle case, so no requirement is violated. Whether the behaviour is
      right is a mission question.
    disposition: >-
      Raised for review, not changed. Candidate requirement FDIR-120: "Leaving a
      mode by ground command while a monitor that requests a more severe mode is
      in alarm shall either be refused, or be reported with the active alarm."
      Two ways to meet it: re-post the latched fault on any ground de-escalation
      while the monitor is in ALARM, or have TC(8,1) acceptance check the
      monitor states. The choice belongs to operations, not to software.

  - id: OBS-02
    kind: OBS
    requirement: (none; MM-030 essential telemetry)
    status: open
    found_by: Lab 8.3, writing procedure SAFE-01 (Yamcs stack), host simulation
    description: >-
      In SAFE only the essential HK (SID 2) is sent, and it carries no monitor
      states. The recovery procedure cannot read "T_BAT monitor CLEARED"; it
      has to compare the raw values with the onboard clear thresholds
      (V_BUS >= 26300 mV, T_BAT <= 43.00 C), which duplicates onboard
      constants in a ground procedure.
    disposition: >-
      Open, raised for review. Workaround in SAFE-01 step 5 (values against
      the thresholds). Candidate change: add the 6-bit monitor state word to
      SID 2 (one octet), and the MDB entry; the downlink cost is 1 octet per
      2 s in SAFE.

  # ---- Capstone integration (Phase 1 and 2) -------------------------------------
  - id: NCR-03
    kind: NCR
    requirement: FDIR-110
    severity: major
    status: fixed
    found_by: tests/unit/test_thermal.c (test_no_new_sequence_until_degraded_left), first run
    description: >-
      After THERMAL_EXHAUSTED the vehicle stays in DEGRADED until the next
      supervisor cycle applies SAFE (up to 2 s). In that gap the next HK cycle
      saw the alarm still present in DEGRADED and started a second attempt
      sequence: a second ATTEMPT 1 event, and the attempt bound of FDIR-100
      broken.
    cause: >-
      The recovery state machine went back to idle on EXHAUSTED with nothing
      to remember that the sequence was spent; the SAFE request is deferred
      by design (cyclic mode machine, D-07).
    disposition: >-
      Fixed: a "spent" latch, set on EXHAUSTED and cleared only when the mode
      leaves DEGRADED (src/fdir/thermal.c). The unit test that found it is kept.
    retest: test_thermal (6 tests), VT-FDIR-100 and the demo scenario step 5, all PASS.

  - id: NCR-04
    kind: NCR
    requirement: SEC-020
    severity: major
    status: open
    found_by: Session 8 system test [8.1-6] on SIS; analysis in the capstone
    description: >-
      On SIS the key store (keys and counters) is held in RAM, because the
      simulator has no non volatile memory. After a processor reset the slot
      counters restart from the factory state, so a telecommand recorded
      before the reset could be accepted again once the floor is reset.
      On the host simulation the key store is a file and the test passes.
    cause: >-
      Platform limit, not a code defect: nv_load/nv_store in
      src/security/security.c are a RAM image under __rtems__.
    disposition: >-
      Open. Mitigation in place: after any reset the counter is untrusted
      (factory state) and commanding needs a recovery TC(210,10) under SPI 0
      with the onboard challenge, and the ground sets the floor above its
      high-water mark, so recorded commands stay below it. Closure needs the
      NV driver of the real OBC (write with read-back, two copies) and a
      retest of [8.1-6] and VT-SEC-010 on the target.
    retest: Session 8 [8.1-6] and VT-SEC-010 on the flight OBC or an emulator with NV memory.

  - id: TA-04
    kind: TA
    requirement: MM-090
    status: fixed
    found_by: VT-01 (cold boot, MM-090), first host run of the integrated campaign
    description: >-
      The first validation test saw no boot event. The secure ground link
      performs the first contact (TC(210,10) under SPI 0) on the first boot,
      and that exchange read and discarded the boot event before the test
      started.
    cause: Test harness - the first contact was added to the link without restarting the spacecraft.
    disposition: >-
      Fixed in tests/validation/run_campaign.py: after the first contact the
      link restarts the spacecraft cold (FDIR NV removed, key store kept), so
      every run starts with the boot it expects. No flight code change.
    retest: Integrated campaign on the host, VT-MM-090 PASS.

  - id: TA-05
    kind: TA
    requirement: TMTC-020
    status: fixed
    found_by: VT-TMTC-020, first host run of the integrated campaign (exception)
    description: >-
      The campaign crashed decoding a 41-octet TM(3,25) as HK SID 1. The
      packet was security housekeeping (SID 3, APID 0x022), new in the
      integrated build.
    cause: Test harness selected HK by service and subtype only.
    disposition: Fixed - every HK selection in the campaign also checks APID 0x020.
    retest: Integrated campaign on the host.

  - id: TA-06
    kind: TA
    requirement: SEC-040
    status: fixed
    found_by: IT-16, first run
    description: >-
      The scheduled command was never released. IT-14 (run just before) had
      put the vehicle in SAFE, which suspends the schedule (MM-020), so the
      test was checking a schedule that was correctly stopped.
    cause: Test order dependency in int_tc_path.c.
    disposition: IT-16 now enables the schedule with an authenticated TC(11,1) first.
    retest: Integration level 16/16 PASS.

  - id: TA-07
    kind: TA
    requirement: SEC-030
    status: fixed
    found_by: VT-SEC-020, first host run
    description: >-
      The test set the counter copies to N, N, N + 7 and expected a
      COUNTER_VOTE event. None came. Two copies agreeing is a majority: the
      key store repairs the odd copy silently and the counter stays N.
    cause: >-
      The test's expectation was wrong, not the code. keystore.c reports a
      vote (and takes the largest copy) only when no two copies agree; a
      single disagreeing copy is an ordinary repair. That is the Lab 8.2
      design (design-analysis.md, "counter upsets").
    disposition: >-
      Test corrected - copies N, N + 3, N + 7 (no majority). The test now
      also checks that the counter becomes N + 7, the largest copy, so no
      used value becomes acceptable again, and that the ground must move
      its counter above it.
    retest: Integrated campaign on the host, VT-SEC-020.

  - id: OBS-03
    kind: OBS
    requirement: (none; static analysis process)
    status: open
    found_by: Capstone integration, static analysis set-up
    description: >-
      cppcheck and its MISRA C:2012 addon have not been run on the Session 8
      security files and the capstone thermal recovery (tc_auth.c, keystore.c,
      sec_service.c, sec_report.c, security.c, thermal.c). GCC and clang at
      the maximum warning set, GCC -fanalyzer and the clang analyser have, with
      every finding dispositioned.
    disposition: >-
      Open. The fast-checks CI job runs cppcheck on every push. Findings in
      these files that no project-wide rule covers match SA-50 (disposition
      "open") and are listed in findings-current.md, so they are visible
      without failing every build. To close - triage each one into fixed,
      justified or accepted, then delete SA-50.

  - id: NCR-05
    kind: NCR
    requirement: (coding standard - MISRA C:2012 rule 5.9, advisory)
    severity: minor
    status: fixed
    found_by: fast-checks CI, static analysis job, first push of the integrated tree (commit 45eb083)
    description: >-
      cppcheck's whole-program MISRA check found static helper functions with the same name in
      different files of the one application (put16, put32, get32, get_u32, event, nv_path, persist,
      sat8, sat16), and one variable whose scope could be reduced (aux in fdir_payload_command).
      Each lab had been analysed on its own, where no two files shared a program.
    cause: >-
      Integration. The Session 8 security files reuse the helper names of the Session 4 and 5 files.
      Rule 5.9 asks for unique internal identifiers across the program, so that a reader, or a
      debugger symbol table, never confuses two different functions.
    disposition: >-
      Fixed in commit 5fcd74f. The security files use their own prefixes (rep_, svc_, ks_, auth_,
      sec_, inj_), and aux moved into its block. All test levels were rerun, and the CI static
      analysis job is green.
    retest: fast-checks run 44120294053 green; unit 142, integration 16/16, scenario 28/28.

  - id: TA-08
    kind: TA
    requirement: SEC-040
    status: fixed
    found_by: First SIS run of the integrated campaign (make sis), 29 of 35 tests failed
    description: >-
      On SIS every command after the first spacecraft run was refused with
      SEC_STATE and no TM(1,x). SID 3 showed FIRST CONTACT NEEDED (slot 1
      counter untrusted) at every boot.
    cause: >-
      The campaign performed the first contact once, when the link was
      created. On the host the key store is a file, so the floor survives
      every restart. On SIS it is RAM (NCR-04): every boot is a factory key
      store and needs its own first contact. The flight code behaved as
      SEC-040 requires (fail closed); the harness assumed host behaviour.
    disposition: >-
      Fixed in run_campaign.py. The first contact runs after every boot,
      once the boot report has been captured, and is a no-op when the
      counter is trusted. FDIR event checks now select APID 0x021, so the
      RECOVERY_USED security event of each first contact is not counted as
      an unexpected FDIR event.
    retest: Host campaign rerun (unchanged verdicts); SIS campaign rerun by the user.

