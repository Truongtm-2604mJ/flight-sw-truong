# LOTUS-1 - unit and integration tests that also verify each requirement
# (validation tests list their requirements themselves, in
# tests/validation/run_campaign.py). Read by build_matrix.py, which takes
# every verdict from the test outputs.
#   unit:        Unity test function names (tests/unit/*.c)
#   integration: IT ids (tests/integration/int_tc_path.c)
#   analysis:    evidence files (analysis, and the security system test logs): PASS if the file exists and matches 'expect',
#                NOT RUN if the file is missing (target evidence not produced yet)
#   s6:          Session 6 model tests (labs/session-06, run on the same generated mode_sm.c)
TIM-010:
  analysis:
  - {file: evidence/timing/budget-estimate.md, expect: the task set CLOSES, name: response time analysis (estimate)}
  - {file: evidence/timing/budget-sis.md, expect: 'the task set CLOSES \(every R <= T, no missed period\)', name: 'SIS
      run, 60 s'}
TIM-020:
  analysis:
  - {file: tools/timing/estimate.txt, expect: 'accept +\d+ instr/op +~ +[0-4]\d{3}\.\d us', name: instruction count
      estimate}
  - {file: labs/session-08/docs/timing/budget-sis.md, expect: '\| accept \| [\d.]+ \| [\d.]+ \| [0-4]\.\d+ \|',
    name: 'SIS measurement, Session 8 build (same tc_auth.c, keystore.c, tinycrypt): accept max 1.326 ms, reject
      max 1.223 ms'}
